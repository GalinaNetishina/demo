version: "3.7"
services:
  db: 
    image: postgres:17.0
    container_name: db_app
    command: -p 5435
    expose:
      - 5435
    env_file:
      - .env-non-dev
    volumes:
     - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
     - 5435:5435

  app:
    build:
      context: .
    env_file:
      - .env-non-dev
    container_name: fastapi_app 
    command: ["/fastapi_app/docker/app.sh"]
    ports:
      - 8050:8000
    depends_on: 
      - db

